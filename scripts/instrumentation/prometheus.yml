# prometheus.yml
global:
  scrape_interval: 15s  # How often to scrape targets by default
  evaluation_interval: 15s  # How often to evaluate rules

scrape_configs:
  - job_name: 'sidecar'
    scrape_interval: 15s  # Scrape interval for this job
    metrics_path: '/metrics'  # Path to the metrics endpoint (default is /metrics)
    static_configs:
      - targets: ['host.docker.internal:8081']  # The endpoint where the sidecar metrics server is running
