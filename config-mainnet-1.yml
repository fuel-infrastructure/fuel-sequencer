    bonded: 1000000fuel
    home: ./data/fuelsequencer
    app:
      sidecar:
        enabled: false  # to be able to run this config file more easily
genesis:
  app_version: "seq-mainnet-1"  # manually overridden for a more meaningful app version
  genesis_time: "2024-11-01T00:00:00Z"  # TODO
  chain_id: "seq-mainnet-1"
  app_state:
    bridge:
      params:
        bridge_denom: "fuel"
        bridge_denom_total_supply: "10000000000000000000"
        ethereum_proxy_contract_address: "0x96De789353a25bA29e909Fb8eF1E84D7Ca104490"  # TODO: https://etherscan.io/address/TODO
        authorize_messages_allowed:
          - "/cosmos.bank.v1beta1.MsgSend"
          - "/cosmos.staking.v1beta1.MsgDelegate"
          - "/cosmos.staking.v1beta1.MsgBeginRedelegate"
          - "/cosmos.distribution.v1beta1.MsgWithdrawDelegatorReward"
          - "/cosmos.distribution.v1beta1.MsgSetWithdrawAddress"
          - "/cosmos.gov.v1.MsgVote"
        supply_delta_period: "14400"
        vesting_start_time: "2024-11-01T00:00:00Z"  # TODO
        max_eth_block_update_delay: "14400s"
        injected_event_tx_max_bytes: "115343"
        sequencer_txs_allocation: "0.500000000000000000"
        max_authorize_messages: "5"
      last_ethereum_block_synced: "1"  # TODO: 1 block before deployment of Sequencer Proxy Contract
    distribution:
      params:
        community_tax: "0.000000000000000000"
    gov:
      params:
        min_deposit:
          - amount: "2400000000000"
            denom: "fuel"
        max_deposit_period: "604800s"  # 7 days
        voting_period: "604800s"  # 7 days
        quorum: "0.400000000000000000"
        min_initial_deposit_ratio: "0.100000000000000000"
        expedited_min_deposit:
          - amount: "2500000000000"
            denom: "fuel"
        proposal_cancel_ratio: "0.000000000000000000"
        proposal_cancel_dest: "fuelsequencer10d07y265gmmuvt4z0w9aw880jnsr700jdjfvk3"  # gov
        expedited_voting_period: "86400s"  # 1 day
        burn_vote_veto: false
    mint:
      params:
        mint_denom: "fuel"
        inflation_rate_change: "0.000000000000000000"
        inflation_max: "0.000000000000000000"  # no inflation at genesis
        inflation_min: "0.000000000000000000"  # no inflation at genesis
        blocks_per_year: "5259600"  # assuming a block time of 6s
    sequencing:
      params:
        max_blob_size_bytes: "1048576"  # 1MiB
        sequencer_tx_max_bytes: "1153433"  # 1.1MiB
    slashing:
      params:
        signed_blocks_window: "80000"
        min_signed_per_window: "0.800000000000000000"
        downtime_jail_duration: "60s"
        slash_fraction_double_sign: "0.050000000000000000"
        slash_fraction_downtime: "0.000100000000000000"
    staking:
      params:
        bond_denom: "fuel"
        unbonding_time: "1209600s"
        max_validators: "12"
        min_commission_rate: "0.050000000000000000"
  consensus:
    params:
      block:
        max_bytes: "2306867"  # 2.2MiB
        max_gas: "100000000"
