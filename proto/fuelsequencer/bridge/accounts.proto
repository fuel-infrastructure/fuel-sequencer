syntax = "proto3";
package fuelsequencer.bridge;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "cosmos/auth/v1beta1/auth.proto";

option go_package = "github.com/fuel-infrastructure/fuel-sequencer/x/bridge/types";

// An CrosschainAccount is defined as a BaseAccount & the address of the account owner on the controller chain
message CrosschainAccount {
  option (gogoproto.goproto_getters)         = false;
  option (gogoproto.goproto_stringer)        = false;
  option (cosmos_proto.implements_interface) = "fuelsequencer.bridge.InterchainAccountI";

  cosmos.auth.v1beta1.BaseAccount base_account  = 1 [(gogoproto.embed) = true];
  string                          account_owner = 2;
}
