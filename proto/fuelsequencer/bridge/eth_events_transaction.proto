syntax = "proto3";
package fuelsequencer.bridge;

import "fuelsequencer/service/v1/sidecar.proto";

option go_package = "github.com/fuel-infrastructure/fuel-sequencer/x/bridge/types";

message EthEventsTx {
  // events defines the list of Ethereum events.
  repeated fuelsequencer.service.v1.Event events = 1;
}