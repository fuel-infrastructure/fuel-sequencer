# Redis configuration for blob storage
# Based on Redis Docker Hub best practices and blob storage requirements

# Network
bind 0.0.0.0
port 6379
protected-mode no

# General
daemonize no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""

# Snapshotting (RDB persistence)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF persistence enabled for durability guarantees

## Memory overcommit must be enabled! Without it, a background save or replication may fail under low memory condition. Being disabled, it can also cause failures without low memory condition, see https://github.com/jemalloc/jemalloc/issues/1328. To fix this issue add 'vm.overcommit_memory = 1' to /etc/sysctl.conf and then reboot or run the command 'sysctl vm.overcommit_memory=1' for this to take effect.

# Critical for blob storage - ensures data survives system failures
appendonly yes
appendfilename "appendonly.aof"
# fsync every second - good balance between durability and performance
# Data loss window: max 1 second in case of system failure
appendfsync everysec
# Prevent data loss during AOF rewrite
no-appendfsync-on-rewrite no
# Auto-rewrite AOF when it grows 100% and is at least 64MB
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
# Use AOF with RDB format for faster loading
aof-use-rdb-preamble yes

# Memory management - disk-backed storage with eviction
# Memory serves as cache for recent data (~15 min at 2.5 MiB/sec rate)
# Limit memory to 1GB to prevent unbounded growth and reduce restart loading time
maxmemory 1gb
# Use volatile-ttl eviction (less CPU-intensive than LRU, evicts keys with nearest expiration)
maxmemory-policy volatile-ttl

# Performance optimizations for blob storage
# Disable expensive operations we don't need
hash-max-listpack-entries 512
hash-max-listpack-value 64
list-max-listpack-size -2
set-max-intset-entries 512
zset-max-listpack-entries 128
zset-max-listpack-value 64

# Client settings - optimized for high-throughput scenarios
timeout 600
tcp-keepalive 60
tcp-backlog 1024

# Slow log (for debugging)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Lazy freeing (for better performance with large objects)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Disable some features we don't need for blob storage
notify-keyspace-events "" 