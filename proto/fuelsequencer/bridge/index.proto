syntax = "proto3";
package fuelsequencer.bridge;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/fuel-infrastructure/fuel-sequencer/x/bridge/types";

message Index {

  // num_injected_events is the number of Ethereum events injected as
  // transactions in the current block, plus any SupplyDelta.
  uint64 num_injected_txs_total = 1;

  // num_injected_events is the number of injected transactions that
  // have been seen by the AnteHandler.
  uint64 num_injected_txs_ante = 2;

  // num_failed_special_txs is the number of failed special transactions, i.e.
  // MsgIndex, MsgDepositFromEthereum, and MsgSupplyDelta. We should stop block
  // production if any of these fails because something is really wrong.
  uint64 num_failed_special_txs = 3;
}
