syntax = "proto3";
package fuelsequencer.sequencing;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/fuel-infrastructure/fuel-sequencer/x/sequencing/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "fuelsequencer/x/sequencing/Params";
  option (gogoproto.equal) = true;

  // max_blob_size_bytes is the maximum size of blob that can be submitted in
  // bytes.
  uint64 max_blob_size_bytes = 1;
}
