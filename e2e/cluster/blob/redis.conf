# Redis configuration for blob storage
# Based on Redis Docker Hub best practices and blob storage requirements

# Network
bind 0.0.0.0
port 6379
protected-mode no

# General
daemonize no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""

# Snapshotting (RDB persistence)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF persistence disabled for better performance
# Use RDB snapshots only for blob storage workloads
appendonly no

# Memory management - optimized for high-throughput blob storage
maxmemory 8gb
maxmemory-policy allkeys-lru

# Performance optimizations for blob storage
# Disable expensive operations we don't need
hash-max-listpack-entries 512
hash-max-listpack-value 64
list-max-listpack-size -2
set-max-intset-entries 512
zset-max-listpack-entries 128
zset-max-listpack-value 64

# Client settings - optimized for high-throughput scenarios
timeout 600
tcp-keepalive 60
tcp-backlog 1024

# Slow log (for debugging)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Lazy freeing (for better performance with large objects)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Disable some features we don't need for blob storage
notify-keyspace-events "" 