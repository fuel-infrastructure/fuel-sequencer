syntax = "proto3";
package fuelsequencer.reports.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "fuelsequencer/reports/params.proto";
import "fuelsequencer/reports/slash_report.proto";

option go_package = "github.com/fuel-infrastructure/fuel-sequencer/x/reports/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/fuel-sequencer/reports/v1/params";
  }

  // Queries a slashing report by height.
  rpc SlashReport(QueryGetSlashReportRequest)
      returns (QueryGetSlashReportResponse) {
    option (google.api.http).get =
        "/fuel-sequencer/reports/v1/slash_report/{height}";
  }

  // Queries all slashing reports in state.
  rpc SlashReportAll(QueryAllSlashReportRequest)
      returns (QueryAllSlashReportResponse) {
    option (google.api.http).get = "/fuel-sequencer/reports/v1/slash_report";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {

  // params holds all the parameters of this module.
  Params params = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// QueryGetSlashReportRequest is request type for the Query/GetSlashReport RPC
// method.
message QueryGetSlashReportRequest {

  // the height of the slashing report to query from state
  uint64 height = 1;
}

// QueryGetSlashReportResponse is response type for the Query/GetSlashReport RPC
// method.
message QueryGetSlashReportResponse {

  // slash_report holds the slashing report queried by height
  SlashReport slash_report = 1 [ (gogoproto.nullable) = false ];
}

// QueryAllSlashReportRequest is request type for the Query/AllSlashReport RPC
// method.
message QueryAllSlashReportRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryAllSlashReportResponse is response type for the Query/AllSlashReport RPC
// method.
message QueryAllSlashReportResponse {

  // slash_report holds all the slashing reports stored in state
  repeated SlashReport slash_report = 1 [ (gogoproto.nullable) = false ];

  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}