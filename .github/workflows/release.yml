# Build multi-arch Docker images via FuelLabs/github-actions (native per-arch
# runners + digest merge). Replaces the previous single-runner QEMU
# `platforms: linux/amd64,linux/arm64` build, which published a broken arm64
# variant (Graviton: `exec /bin/sh: exec format error` on chain-init).
#
# Also keeps Ignite release asset publishing for tags.
name: Build and publish

on:
  push:
    branches:
      - main
    tags:
      - "seq-*"
      - "v*"
      - "internal-*"
      - "telescope-*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release-binaries:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Release Variables
        id: vars
        uses: ignite/cli/actions/release/vars@main

      - name: Issue Release Assets
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        uses: ignite/cli/actions/cli@main
        with:
          args: chain build --release --release.prefix ${{ steps.vars.outputs.tarball_prefix }} -t linux:amd64 -t darwin:amd64 -t darwin:arm64 -y
        env:
          DO_NOT_TRACK: 1

      - name: Delete the "latest" Release
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        if: ${{ steps.vars.outputs.is_release_type_latest == 'true' }}
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          delete_release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the Release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          files: release/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Native amd64 + arm64 builds (not QEMU multi-platform on one runner).
  # Pin matches fuel-o2 / FuelLabs/github-actions@master tip used elsewhere.
  docker:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: FuelLabs/github-actions/.github/workflows/docker-build-push.yml@c2b9e5cd3e20180538f1b2d2841636e85eddfab4
    with:
      auth-mode: registry-login
      registry: ghcr.io
      dockerfile: Dockerfile
      # Nested package path used by fuel-deployment-v2 (…/fuel-sequencer/fuel:tag).
      image: ghcr.io/${{ github.repository }}/fuel
      build-backend: native
      platforms: linux/amd64,linux/arm64
      runs-on: ubuntu-latest
      runs-on-amd64: ubuntu-latest
      runs-on-arm64: ubuntu-24.04-arm
      docker-context: .
      tags: |
        type=ref,event=branch
        type=sha,prefix=
        type=ref,event=tag
        type=raw,value=latest,enable={{is_default_branch}}
    secrets:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
