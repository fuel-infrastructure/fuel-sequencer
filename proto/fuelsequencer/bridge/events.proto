syntax = "proto3";
package fuelsequencer.bridge;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "google/protobuf/any.proto";

option go_package = "github.com/fuel-infrastructure/fuel-sequencer/x/bridge/types";

message EventSupplyDeltaReported {

  // supply_delta is the latest supply delta reported to Ethereum.
  string supply_delta = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // nonce is the latest nonce reported to Ethereum.
  string nonce = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

message EventWithdrawToEthereumReported {

  // nonce uniquely identifies any message that we send to Ethereum.
  string nonce = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // from is the user address that is withdrawing the tokens from the Sequencer.
  // can be in Hex or Bech32 format.
  string from = 2;

  // to is the user address on Ethereum that will be receiving the tokens.
  string to = 3;

  // amount is the tokens being sent, which must be the expected bridge token.
  cosmos.base.v1beta1.Coin amount = 4 [ (gogoproto.nullable) = false ];
}

message EventDepositEventProcessed {
  // the sending Ethereum address in hex format
  string depositor = 1;

  // recipient Ethereum address in hex or bech32 format
  string recipient = 2;

  // amount is the tokens being sent, which must be denominated in the expected
  // bridge token.
  cosmos.base.v1beta1.Coin amount = 3 [ (gogoproto.nullable) = false ];

  // vesting duration encoded in string to prevent loss of precision. Sign is
  // also preserved. This can be zero if no duration is specified.
  string lockup = 4;
}

message EventDepositEventFailed {
  // event_details is the marshalled event that failed to be processed.
  bytes event_details = 1;
}

message EventEthereumBlockSynced {
  // block_number is the Ethereum block that was synced partially or fully.
  uint64 block_number = 1;

  // full_sync is true if the Ethereum block has been fully synced.
  bool full_sync = 2;
}

message EventEthereumTxMapping {
  // eth_block_number is the block number of the tx on Ethereum.
  uint64 eth_block_number = 1;

  // eth_log_index is the index of the log on Ethereum.
  uint32 eth_log_index = 2;

  // eth_tx_index is the index of the tx on Ethereum.
  uint32 eth_tx_index = 3;

  // eth_tx_hash is the hash of the tx on Ethereum.
  string eth_tx_hash = 4;

  // seq_tx_hash is the hash of the tx on the Sequencer.
  string seq_tx_hash = 5;

  // reason_for_skip is the justification if the sidecar skipped the tx.
  string reason_for_skip = 6;
}
