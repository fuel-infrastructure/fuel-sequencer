name: blob-storage

services:
  redis:
    image: redis:7.2.4 # Last version compatible with valkey
    restart: unless-stopped
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Resource limits for production safety
    deploy:
      resources:
        limits:
          memory: 2.5g
        reservations:
          memory: 1g
    # Environment variables for Redis
    environment:
      - REDIS_REPLICATION_MODE=master
    # Security and performance optimizations
    sysctls:
      - net.core.somaxconn=1024
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "6379:6379"
    networks:
      - blob-storage-network
    container_name: blob-storage-redis

  server:
    extends:
      file: pkg/server/docker-compose.yml
      service: server
    environment:
      - STORE_TYPE=redis
      - REDIS_URL=redis:6379
    networks:
      - blob-storage-network
    container_name: blobhub-server
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    volumes:
      - "../../configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9019:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - blob-storage-network
    container_name: blob-storage-prometheus
    depends_on:
      server:
        condition: service_healthy

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.12.3
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SWAGGER_JSON=/swagger/swagger.json
      - BASE_URL=/swagger
    volumes:
      - ../../api/swagger:/swagger:ro
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    depends_on:
      server:
        condition: service_healthy
    networks:
      - blob-storage-network
    container_name: blobhub-api-docs

networks:
  blob-storage-network:
    driver: bridge
    name: blob-storage-network

volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
