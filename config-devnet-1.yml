version: 1
build:
  binary: "fuelsequencerd"
  main: ./cmd/fuelsequencerd
accounts:
  - name: alice
    coins:
      - 999996000000utest
    mnemonic: dinner crash nurse casino baby fold race cheese elite column sausage sleep close royal rain over mechanic minimum outdoor conduct cash wagon frog evidence
  - name: validator1
    coins:
      - 2000000utest
    address: fuelsequencer1cv0rl38sckgwyrkdd5vanyzf6v8clf808ttyf4
  - name: validator2
    coins:
      - 2000000utest
    address: fuelsequencer1ddjv8z30raavjc8ku6n6mqlm9rjhezs2u4jetp
client:
  openapi:
    path: docs/static/openapi.yml
validators:
  - name: alice
    bonded: 1000000utest
    config:
      consensus:
        # How long we wait for a proposal block before prevoting nil
        timeout_propose: "1s"
        # How much timeout_propose increases with each round
        timeout_propose_delta: "500ms"
        # How long we wait after receiving +2/3 prevotes for “anything” (ie. not a single block or nil)
        timeout_prevote: "1s"
        # How much the timeout_prevote increases with each round
        timeout_prevote_delta: "500ms"
        # How long we wait after receiving +2/3 precommits for “anything” (ie. not a single block or nil)
        timeout_precommit: "1s"
        # How much the timeout_precommit increases with each round
        timeout_precommit_delta: "500ms"
        # How long we wait after committing a block, before starting on the new
        # height (this gives us a chance to receive some more precommits, even
        # though we already have +2/3).
        timeout_commit: "2s"
    home: ./data/fuelsequencer
genesis:
  genesis_time: "2024-04-19T08:00:00.000000Z"
  chain_id: "seq-devnet-1"
  consensus:
    params:
      block:
        max_bytes: "22020096"
        max_gas: "300000000"
  app_state:
    crisis:
      constant_fee:
        amount: "1000"
        denom: "utest"
    gov:
      params:
        voting_period: "10800s"
        expedited_voting_period: "3600s"
        min_deposit:
          - amount: "1000"
            denom: "utest"
        expedited_min_deposit:
          - amount: "2000"
            denom: "utest"
    mint:
      params:
        mint_denom: "utest"
    slashing:
      params:
        downtime_jail_duration: "14400s"
    staking:
      params:
        bond_denom: "utest"
        unbonding_time: "86400s"
        max_validators: 10
    bridge:
      params:
        bridge_denom: "utest"
        ethereum_proxy_contract_address: "0x0Ac72d9E87B39DAAa81e4F3F29Ce8c45B2bE5fA9"  # just an example
        authorize_messages_allowed:
          - "*"  # allow all
        supply_delta_period: 1000
      last_ethereum_nonce: "0"
      last_ethereum_block_synced: "0"
    sequencing:
      params:
        max_blob_size_bytes: 1000000
