syntax = "proto3";
package fuelsequencer.bridge;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "fuelsequencer/service/v1/sidecar.proto";

option go_package = "github.com/fuel-infrastructure/fuel-sequencer/x/bridge/types";

message EthEventsTx {
  // events defines the list of Ethereum events.
  repeated fuelsequencer.service.v1.Event events = 1;

  // advance_sequencer is a boolean which indicates whether the Sequencer should
  // generate a new block. This is used to advance the Sequencer in cases where
  // the Sidecar errors and the error doesn't warrant the Sequencer to halt the
  // block production. This is specifically used when the next Ethereum block to
  // query is not yet generated, and when the Sidecar is out-of-sync with
  // Ethereum for a small number of blocks (configured on the Sidecar).
  bool advance_sequencer = 2;

  // new_ethereum_block is a boolean which indicates whether a new Ethereum
  // block has been queried from the Sidecar and that the events from it were
  // fully consumed by the Sequencer. This is needed to determine when
  // LastEthereumBlockSynced should be incremented by the PreBlocker. If it's
  // false but the events list is not empty, the block was partially consumed.
  bool new_ethereum_block = 3;

  // block_number is the block that these events belong to. This is expected to
  // be LastEthereumBlockSynced+1, since the events are from the next block.
  uint64 block_number = 4;
}